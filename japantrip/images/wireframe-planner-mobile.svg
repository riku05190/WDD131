<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <rect width="360" height="640" fill="#f8f9fa" stroke="#333333" stroke-width="2" rx="12"/>
  <!-- Header -->
  <rect x="16" y="16" width="328" height="56" fill="#ffffff" stroke="#457b9d" stroke-width="2" rx="6"/>
  <circle cx="44" cy="44" r="16" fill="#e63946"/>
  <text x="70" y="49" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d3557">Budget &amp; Trip Planner</text>
  <rect x="296" y="30" width="32" height="28" fill="#f1faee" stroke="#1d3557" stroke-width="1.5" rx="4"/>
  <text x="305" y="49" font-family="Arial, sans-serif" font-size="16" fill="#1d3557">☰</text>

  <!-- Add Activity Form -->
  <rect x="16" y="84" width="328" height="190" fill="#ffffff" stroke="#457b9d" stroke-width="1.5" rx="6"/>
  <text x="28" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d3557">Add Stop to Itinerary</text>
  <rect x="28" y="118" width="304" height="28" fill="#f8f9fa" stroke="#666666" rx="4"/>
  <text x="38" y="136" font-family="Arial, sans-serif" font-size="11" fill="#555555">Select Destination ▾</text>
  <rect x="28" y="154" width="146" height="28" fill="#f8f9fa" stroke="#666666" rx="4"/>
  <text x="38" y="172" font-family="Arial, sans-serif" font-size="11" fill="#555555">Day (1 - 7)</text>
  <rect x="186" y="154" width="146" height="28" fill="#f8f9fa" stroke="#666666" rx="4"/>
  <text x="196" y="172" font-family="Arial, sans-serif" font-size="11" fill="#555555">Max Budget (¥)</text>
  <rect x="28" y="194" width="304" height="32" fill="#e63946" rx="4"/>
  <text x="180" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+ Add to My Itinerary</text>
  <text x="28" y="252" font-family="Arial, sans-serif" font-size="11" fill="#1d3557">Status: Within Budget ✓</text>

  <!-- Budget Summary Card -->
  <rect x="16" y="286" width="328" height="90" fill="#dceefb" stroke="#1d3557" stroke-width="1.5" rx="6"/>
  <text x="28" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d3557">Trip Summary (via .reduce())</text>
  <text x="28" y="336" font-family="Arial, sans-serif" font-size="12" fill="#333333">Total Stops: 3 | Total Est. Cost: ¥8,000</text>
  <text x="28" y="358" font-family="Arial, sans-serif" font-size="12" fill="#333333">Remaining Budget: ¥12,000</text>

  <!-- Itinerary List -->
  <rect x="16" y="388" width="328" height="182" fill="#ffffff" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="28" y="412" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d3557">Planned Stops</text>
  <rect x="28" y="424" width="304" height="42" fill="#f8f9fa" stroke="#cccccc" rx="4"/>
  <text x="38" y="449" font-family="Arial, sans-serif" font-size="12" fill="#333333">Day 1: Fushimi Inari (¥1,500) [Remove]</text>
  <rect x="28" y="474" width="304" height="42" fill="#f8f9fa" stroke="#cccccc" rx="4"/>
  <text x="38" y="499" font-family="Arial, sans-serif" font-size="12" fill="#333333">Day 2: Mount Fuji (¥4,000) [Remove]</text>

  <!-- Footer -->
  <rect x="16" y="582" width="328" height="42" fill="#1d3557" rx="6"/>
  <text x="180" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f1faee">Footer: © 2026 Riku Nakamura | WDD 131</text>
</svg>
