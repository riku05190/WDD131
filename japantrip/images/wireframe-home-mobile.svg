<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" width="360" height="680">
  <rect width="360" height="680" fill="#f8f9fa" stroke="#333333" stroke-width="2" rx="12"/>
  <!-- Header -->
  <rect x="16" y="16" width="328" height="56" fill="#ffffff" stroke="#457b9d" stroke-width="2" rx="6"/>
  <circle cx="44" cy="44" r="16" fill="#e63946"/>
  <text x="70" y="49" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d3557">JapanTrip Explorer</text>
  <rect x="296" y="30" width="32" height="28" fill="#f1faee" stroke="#1d3557" stroke-width="1.5" rx="4"/>
  <text x="305" y="49" font-family="Arial, sans-serif" font-size="16" fill="#1d3557">☰</text>

  <!-- Hero Banner -->
  <rect x="16" y="84" width="328" height="110" fill="#dceefb" stroke="#457b9d" stroke-width="1.5" rx="6"/>
  <text x="180" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d3557">[Hero Image &amp; Headline]</text>
  <text x="180" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333">Discover &amp; Filter Japan Destinations</text>

  <!-- Search & Filter Controls -->
  <rect x="16" y="206" width="328" height="90" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" rx="6"/>
  <rect x="28" y="218" width="304" height="32" fill="#f8f9fa" stroke="#666666" stroke-width="1" rx="4"/>
  <text x="38" y="239" font-family="Arial, sans-serif" font-size="12" fill="#555555">Search keyword (e.g. Kyoto, shrine)...</text>
  <rect x="28" y="258" width="96" height="26" fill="#1d3557" rx="4"/>
  <text x="76" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">All Regions</text>
  <rect x="132" y="258" width="96" height="26" fill="#e9ecef" stroke="#666666" rx="4"/>
  <text x="180" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333333">Kanto / Kansai</text>
  <rect x="236" y="258" width="96" height="26" fill="#e9ecef" stroke="#666666" rx="4"/>
  <text x="284" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333333">Sort: Rating</text>

  <!-- Destination Card 1 -->
  <rect x="16" y="308" width="328" height="150" fill="#ffffff" stroke="#333333" stroke-width="1.5" rx="6"/>
  <rect x="28" y="320" width="304" height="68" fill="#e9ecef" stroke="#999999" stroke-dasharray="4" rx="4"/>
  <text x="180" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555555">[Destination Image]</text>
  <text x="28" y="408" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d3557">Fushimi Inari Shrine (Kyoto)</text>
  <text x="28" y="426" font-family="Arial, sans-serif" font-size="11" fill="#333333">Tags: Culture, Kansai | Est: ¥1,500 | ⭐⭐⭐⭐⭐</text>
  <rect x="28" y="434" width="110" height="18" fill="#e63946" rx="3"/>
  <text x="83" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">View Details</text>

  <!-- Destination Card 2 -->
  <rect x="16" y="470" width="328" height="140" fill="#ffffff" stroke="#333333" stroke-width="1.5" rx="6"/>
  <rect x="28" y="482" width="304" height="64" fill="#e9ecef" stroke="#999999" stroke-dasharray="4" rx="4"/>
  <text x="180" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555555">[Destination Image]</text>
  <text x="28" y="566" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d3557">Shibuya Crossing &amp; Sky (Tokyo)</text>
  <text x="28" y="584" font-family="Arial, sans-serif" font-size="11" fill="#333333">Tags: City, Kanto | Est: ¥2,500 | ⭐⭐⭐⭐</text>

  <!-- Footer -->
  <rect x="16" y="622" width="328" height="42" fill="#1d3557" rx="6"/>
  <text x="180" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f1faee">Footer: © 2026 Riku Nakamura | WDD 131</text>
</svg>
