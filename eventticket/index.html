<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Event Ticket sign up and validation form for WDD 131."
  >
  <meta name="author" content="Riku Nakamura">
  <title>Event Ticket</title>
  <link rel="icon" type="image/png" href="images/favicon.png?v=2">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Event Ticket</h1>

    <form id="ticketForm" novalidate>
      <div class="field">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          required
        >
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          required
        >
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
        >
      </div>

      <div class="field">
        <label for="type">Type</label>
        <select
          id="type"
          name="type"
          aria-controls="dynamicField"
          required
        >
          <option value="">Choose one</option>
          <option value="Student">Student</option>
          <option value="Guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input
          type="date"
          id="eventDate"
          name="eventDate"
          required
        >
      </div>

      <div id="dynamicField" class="field full" hidden>
        <label id="dynamicLabel" for="dynamicInput">Student #</label>
        <input
          type="text"
          id="dynamicInput"
          name="dynamicInput"
        >
      </div>

      <button type="submit" id="submitBtn" class="full">
        Create Ticket
      </button>
    </form>

    <div
      id="errorMessage"
      class="error-message"
      aria-live="polite"
    ></div>

    <section
      id="output"
      class="output-section"
      aria-live="polite"
    ></section>
  </main>
</body>
</html>
